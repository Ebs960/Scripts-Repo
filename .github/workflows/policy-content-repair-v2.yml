name: Policy Content Repair V2

on:
  push:
    branches:
      - audit/policy-content-quality
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[policy-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out policy research data only
        uses: actions/checkout@v7
        with:
          ref: audit/policy-content-quality
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /Policies/*.asset
            /Policies/*.asset.meta
            /Tech/**/*.asset
            /Tech/**/*.asset.meta
            /Culture/**/*.asset
            /Culture/**/*.asset.meta

      - name: Run semantic-safe full policy repair
        id: repair
        continue-on-error: true
        run: python3 .github/scripts/run_policy_repair_safe_v2.py

      - name: Print full audit report
        if: always()
        run: |
          if [ -f PolicyContentAudit.generated.md ]; then
            cat PolicyContentAudit.generated.md
          fi

      - name: Commit repaired policy assets
        if: always()
        run: |
          git config user.name "policy-content-audit"
          git config user.email "policy-content-audit@users.noreply.github.com"
          git add Policies
          git add --sparse PolicyContentAudit.generated.md
          if git diff --cached --quiet; then
            echo "No policy content changes to commit."
          else
            git commit -m "Repair policy content across full roster [policy-repair]"
            git push origin HEAD:audit/policy-content-quality
          fi

      - name: Fail if blocking audit problems remain
        if: steps.repair.outcome == 'failure'
        run: |
          echo "Blocking policy-audit findings remain. Inspect PolicyContentAudit.generated.md."
          exit 1
